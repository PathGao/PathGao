<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="白日梦想家头像">
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1e2e"/>
      <stop offset="40%"  stop-color="#1e4d60"/>
      <stop offset="70%"  stop-color="#417f84"/>
      <stop offset="100%" stop-color="#d8964f"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd79a" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#f0a95c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f0a95c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="a-clip"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#a-clip)">
    <rect width="512" height="512" fill="url(#a-sky)"/>

    <circle cx="256" cy="232" r="190" fill="url(#a-glow)"/>
    <circle cx="256" cy="232" r="84"  fill="#f7c67f"/>
    <circle cx="256" cy="232" r="84"  fill="#ffe6bb" opacity=".4"/>

    <g fill="#dfe9f0" opacity=".65">
      <circle cx="72"  cy="86"  r="3"/>
      <circle cx="150" cy="46"  r="2.2"/>
      <circle cx="418" cy="72"  r="2.6"/>
      <circle cx="452" cy="140" r="2"/>
    </g>

    <!-- 远山 -->
    <polygon points="-20,392 96,286 190,338 300,262 410,336 520,278 540,392" fill="#1c414f" opacity=".75"/>
    <!-- 近山 -->
    <polygon points="-20,420 84,320 178,368 292,296 396,362 520,306 540,420" fill="#122b36"/>
    <polygon points="292,296 322,314 304,318" fill="#d9ecf0" opacity=".85"/>
    <polygon points="84,320 112,336 96,340"  fill="#d9ecf0" opacity=".85"/>

    <!-- 地平与公路 -->
    <rect x="0" y="412" width="512" height="100" fill="#0e2029"/>
    <polygon points="268,412 420,512 96,512" fill="#232f35"/>
    <path d="M268 414 L182 512" stroke="#f3e3c6" stroke-width="9" stroke-dasharray="20 26"
          stroke-linecap="round" fill="none" opacity=".8"/>

    <!-- 长板骑手 -->
    <g fill="#070c0f" transform="translate(264 442) scale(1.9)">
      <path d="M-22 12 h44 a2 2 0 0 1 0 4 h-44 a2 2 0 0 1 0-4 z"/>
      <circle cx="-14" cy="18" r="2.6"/><circle cx="14" cy="18" r="2.6"/>
      <path d="M-8 12 l4 -13 l7 -3 l3 -9 l5 -2 l1 5 l-4 3 l-2 9 l-6 3 l-2 7 z"/>
      <circle cx="13" cy="-18" r="4.6"/>
      <path d="M10 -12 l-13 -6 l-2 4 l13 7 z"/>
      <path d="M16 -12 l14 -3 l1 4 l-14 4 z"/>
    </g>
  </g>
</svg>
