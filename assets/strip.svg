<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104" role="img" aria-label="滚动的底片">
  <defs>
    <clipPath id="s-win"><rect x="5" y="20" width="190" height="64" rx="2"/></clipPath>
    <style>
      .roll { animation: roll 26s linear infinite; }
      @keyframes roll { from { transform: translateX(0) } to { transform: translateX(-1000px) } }
      @media (prefers-reduced-motion: reduce) { .roll { animation: none } }
    </style>

    <g id="frame">
      <rect x="5" y="20" width="190" height="64" rx="2" fill="#0f2431"/>
      <rect x="16" y="6"  width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
      <rect x="90" y="6"  width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
      <rect x="164" y="6" width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
      <rect x="16" y="88" width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
      <rect x="90" y="88" width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
      <rect x="164" y="88" width="20" height="10" rx="2.5" fill="#e9e3d6" opacity=".8"/>
    </g>

    <g id="strip">
      <!-- 1 冰岛的路 -->
      <g><use href="#frame"/><g clip-path="url(#s-win)">
        <rect x="5" y="20" width="190" height="64" fill="#20515f"/>
        <circle cx="150" cy="52" r="13" fill="#f6c37c"/>
        <polygon points="5,70 50,44 88,62 130,40 195,70" fill="#12313d"/>
        <rect x="5" y="68" width="190" height="16" fill="#0d2029"/>
        <polygon points="112,68 168,84 46,84" fill="#26343a"/>
        <path d="M112 69 L84 84" stroke="#f3e3c6" stroke-width="3" stroke-dasharray="5 7" fill="none" opacity=".8"/>
      </g></g>
      <!-- 2 海 -->
      <g transform="translate(200 0)"><use href="#frame"/><g clip-path="url(#s-win)">
        <rect x="5" y="20" width="190" height="64" fill="#1b3f57"/>
        <circle cx="58" cy="44" r="11" fill="#ffd9a8" opacity=".9"/>
        <rect x="5" y="58" width="190" height="26" fill="#123246"/>
        <path d="M5 64 q22 -5 44 0 t44 0 t44 0 t58 0" stroke="#6fb0bd" stroke-width="2" fill="none" opacity=".7"/>
        <path d="M5 74 q22 -5 44 0 t44 0 t44 0 t58 0" stroke="#6fb0bd" stroke-width="2" fill="none" opacity=".45"/>
      </g></g>
      <!-- 3 火山 -->
      <g transform="translate(400 0)"><use href="#frame"/><g clip-path="url(#s-win)">
        <rect x="5" y="20" width="190" height="64" fill="#2d2130"/>
        <polygon points="5,84 70,36 100,52 135,30 195,84" fill="#1c1420"/>
        <polygon points="135,30 128,26 143,26" fill="#e8703c"/>
        <circle cx="90" cy="36" r="2" fill="#ff9a5b" opacity=".8"/>
        <circle cx="150" cy="42" r="1.6" fill="#ff9a5b" opacity=".6"/>
        <rect x="5" y="78" width="190" height="6" fill="#e8703c" opacity=".35"/>
      </g></g>
      <!-- 4 一碗面 -->
      <g transform="translate(600 0)"><use href="#frame"/><g clip-path="url(#s-win)">
        <rect x="5" y="20" width="190" height="64" fill="#26303a"/>
        <path d="M70 50 h60 a30 30 0 0 1 -60 0 z" fill="#e9dcc4"/>
        <rect x="66" y="47" width="68" height="4" rx="2" fill="#f3ead6"/>
        <path d="M84 42 q4 -9 -2 -14" stroke="#c9dbe0" stroke-width="2" fill="none" opacity=".7"/>
        <path d="M100 40 q5 -10 -1 -16" stroke="#c9dbe0" stroke-width="2" fill="none" opacity=".7"/>
        <path d="M116 42 q4 -9 -2 -14" stroke="#c9dbe0" stroke-width="2" fill="none" opacity=".7"/>
        <rect x="140" y="36" width="3" height="34" rx="1.5" fill="#8d6a48" transform="rotate(10 141 53)"/>
        <rect x="148" y="36" width="3" height="34" rx="1.5" fill="#8d6a48" transform="rotate(16 149 53)"/>
      </g></g>
      <!-- 5 一坛酒 -->
      <g transform="translate(800 0)"><use href="#frame"/><g clip-path="url(#s-win)">
        <rect x="5" y="20" width="190" height="64" fill="#2a2436"/>
        <path d="M86 40 h28 v6 l10 12 v18 a6 6 0 0 1 -6 6 h-36 a6 6 0 0 1 -6 -6 v-18 l10 -12 z" fill="#3d3550"/>
        <path d="M80 62 h40 v14 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 z" fill="#a8582f"/>
        <rect x="84" y="34" width="32" height="7" rx="2" fill="#d9c79c"/>
        <circle cx="92"  cy="70" r="2" fill="#f0c98d" opacity=".8"/>
        <circle cx="104" cy="74" r="1.5" fill="#f0c98d" opacity=".6"/>
        <circle cx="112" cy="68" r="1.8" fill="#f0c98d" opacity=".7"/>
      </g></g>
    </g>
  </defs>

  <rect width="1000" height="104" fill="#12181d"/>
  <g class="roll">
    <use href="#strip"/>
    <use href="#strip" x="1000"/>
  </g>
</svg>
